name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Initialize or link EAS project
        run: eas init --account jarvismok77 --non-interactive

      - name: Bundle Android JavaScript preflight
        run: npx expo export --platform android --output-dir .expo-export

      - name: Build Android APK on EAS
        run: |
          set +e
          eas build --platform android --profile preview --non-interactive --wait --verbose-logs
          BUILD_EXIT=$?
          echo "EAS build exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Recent EAS builds for this commit:"
            eas build:list               --platform android               --buildProfile preview               --gitCommitHash "$GITHUB_SHA"               --limit 1               --json || true
            exit "$BUILD_EXIT"
          fi

      - name: Download APK
        run: |
          set -euo pipefail
          eas build:list             --platform android             --buildProfile preview             --status finished             --gitCommitHash "$GITHUB_SHA"             --limit 1             --json > eas-build-list.json
          APK_URL="$(jq -er '.[0].artifacts.buildUrl' eas-build-list.json)"
          curl -fL "$APK_URL" -o jarvis-tracker.apk
          test -s jarvis-tracker.apk
          file jarvis-tracker.apk
          ls -lh jarvis-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-tracker-apk
          path: jarvis-tracker.apk
          if-no-files-found: error
          retention-days: 30
